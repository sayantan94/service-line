<div class="wrap">
  <header>
    <div class="brand"><span>SL</span>Service Line · Runtime design</div>
    <h1>Run log and recovery</h1>
    <p class="lede">How a run is recorded and what the engine does after a crash.</p>
  </header>
  <nav class="pages" aria-label="Design pages"><a href="index.html">Overview</a><a href="parts.html">Parts</a><a href="steps.html">Steps</a><a href="run-log.html" aria-current="page">Run log and recovery</a><a href="agents.html">Agents and limits</a><a href="verification.html">Verification</a><a href="learning.html">Learning</a><a href="loops.html">Loops and workflows</a></nav>

  <section>
    <h2>The run log</h2>
    <figure>
      <div class="scroll"><svg viewBox="0 0 1000 230" role="img" aria-label="The run log is a row of events. A step start is followed by a call start, which is synced to disk before the agent runs; the result is written as a call end. The same happens for each check command. The step end closes the step."><defs><marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mh"/></marker><marker id="ar7w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mw"/></marker></defs><rect class="b" x="20" y="50" width="130" height="44" rx="7"/><text class="t" x="85" y="77" text-anchor="middle" style="font-family:var(--mono);font-size:12px">step/start</text><line class="a" x1="150" y1="72" x2="178" y2="72" marker-end="url(#ar7)"/><rect class="b" x="180" y="50" width="130" height="44" rx="7"/><text class="t" x="245" y="77" text-anchor="middle" style="font-family:var(--mono);font-size:12px">call/start</text><line class="a" x1="310" y1="72" x2="338" y2="72" marker-end="url(#ar7)"/><rect class="b" x="340" y="50" width="130" height="44" rx="7"/><text class="t" x="405" y="77" text-anchor="middle" style="font-family:var(--mono);font-size:12px">call/end</text><line class="a" x1="470" y1="72" x2="498" y2="72" marker-end="url(#ar7)"/><rect class="b" x="500" y="50" width="130" height="44" rx="7"/><text class="t" x="565" y="77" text-anchor="middle" style="font-family:var(--mono);font-size:12px">check/start</text><line class="a" x1="630" y1="72" x2="658" y2="72" marker-end="url(#ar7)"/><rect class="b" x="660" y="50" width="130" height="44" rx="7"/><text class="t" x="725" y="77" text-anchor="middle" style="font-family:var(--mono);font-size:12px">check/end</text><line class="a" x1="790" y1="72" x2="818" y2="72" marker-end="url(#ar7)"/><rect class="b" x="820" y="50" width="130" height="44" rx="7"/><text class="t" x="885" y="77" text-anchor="middle" style="font-family:var(--mono);font-size:12px">step/end</text><text class="l" x="20" y="34">events.jsonl, one line per event, numbered from zero</text><rect class="ag" x="200" y="150" width="250" height="44" rx="7"/><text class="t" x="325" y="177" text-anchor="middle">Agent works</text><line class="a" x1="245" y1="94" x2="245" y2="148" marker-end="url(#ar7)"/><text class="l" x="237" y="126" text-anchor="end">synced first</text><line class="a" x1="405" y1="150" x2="405" y2="96" marker-end="url(#ar7)"/><text class="l" x="413" y="126">result</text><rect class="b" x="520" y="150" width="250" height="44" rx="7"/><text class="t" x="645" y="177" text-anchor="middle">Command runs</text><line class="a" x1="565" y1="94" x2="565" y2="148" marker-end="url(#ar7)"/><text class="l" x="557" y="126" text-anchor="end">synced first</text><line class="a" x1="725" y1="150" x2="725" y2="96" marker-end="url(#ar7)"/><text class="l" x="733" y="126">result</text></svg></div>
      <figcaption>Every step and every side effect is bracketed by a start and an end event, and the log is forced to disk before anything runs. A start with no end therefore means the action may have run. The current step, the repair count and what the UI shows are all computed by replaying this log.</figcaption>
    </figure>
  </section>

  <section>
    <h2>Recovery after a crash</h2>
    <figure>
      <div class="scroll"><svg viewBox="0 0 1000 250" role="img" aria-label="On restart the engine reads the log. If the step ended it continues. If the step was open and nothing had started it runs the step again. If a call or command had started with no end, the outcome is unknown, so it resets the checkout to the last checkpoint and then runs the step again."><defs><marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mh"/></marker><marker id="ar8w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mw"/></marker></defs><rect class="b" x="20" y="95" width="180" height="60" rx="7"/><text class="t" x="110" y="121" text-anchor="middle">Engine restarts</text><text class="s" x="110" y="139" text-anchor="middle">reads the run log</text><rect class="b" x="280" y="30" width="270" height="50" rx="7"/><text class="t" x="415" y="60" text-anchor="middle">Step ended</text><rect class="b" x="620" y="30" width="360" height="50" rx="7"/><text class="c" x="800" y="60" text-anchor="middle" style="font-size:12px">Continue with the next step</text><path class="a" d="M200,125 H240 V55 H278" marker-end="url(#ar8)"/><line class="a" x1="550" y1="55" x2="618" y2="55" marker-end="url(#ar8)"/><rect class="b" x="280" y="100" width="270" height="50" rx="7"/><text class="t" x="415" y="130" text-anchor="middle">Step open, nothing started</text><rect class="b" x="620" y="100" width="360" height="50" rx="7"/><text class="c" x="800" y="130" text-anchor="middle" style="font-size:12px">Run the step again</text><path class="a" d="M200,125 H240 V125 H278" marker-end="url(#ar8)"/><line class="a" x1="550" y1="125" x2="618" y2="125" marker-end="url(#ar8)"/><rect class="wb" x="280" y="170" width="270" height="50" rx="7"/><text class="t" x="415" y="200" text-anchor="middle">A call or command started, no end</text><rect class="wb" x="620" y="170" width="360" height="50" rx="7"/><text class="c" x="800" y="200" text-anchor="middle" style="font-size:12px">Reset the checkout to the last checkpoint, then run again</text><path class="a" d="M200,125 H240 V195 H278" marker-end="url(#ar8)"/><line class="aw" x1="550" y1="195" x2="618" y2="195" marker-end="url(#ar8w)"/><text class="lw" x="415" y="238" text-anchor="middle">outcome unknown</text></svg></div>
      <figcaption>The engine never continues a step from the middle. It closes whatever was open and starts that step again, from a clean checkpoint when it can't tell what happened.</figcaption>
    </figure>
  </section>
</div>
</body>
</html>
