<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc">
<title id="title">Dreaming: history into current, usable memory</title>
<desc id="desc">Stable history and current memory, together with time and version changes, feed background synthesis. It proposes facts, preferences, context, constraints, lessons, and skills. Service Line separately checks technical claims and asks a human to review the diff before publishing. Future work retrieves relevant entries, checks validity, and records the memory version used. Rejected or unsupported changes leave current memory unchanged. Time passing is not proof that a task finished.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 10" fill="none" stroke="#405970" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:'Chalkboard SE','Segoe Print','Comic Sans MS',cursive;fill:#293b4c}
.title{font-size:32px;font-weight:600}.subtitle{font-family:Arial,sans-serif;font-size:18px;fill:#607080}
.section{font-family:Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:1.8px;fill:#5b7e99}
.heading{font-size:22px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#607080}
.connector{fill:none;stroke:#405970;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
</style>
<rect width="1080" height="850" fill="#fffefa"/>

