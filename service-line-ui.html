    const localVerificationGuide="# Service Line UI \u2014 verification\n\nContract version: 1\nScope: the local HTML prototype in this repository.\n\nThe prototype simulates work and evidence. It does not run Codex/Claude, create\nproduct working folders, start services, replay backend traffic, or merge code.\nVerify the interface's behavior without treating its sample results as real tests\nof AppliedIn or another product.\n\n## Environment\n\n- Open `service-line-ui.html` from this checkout in a browser.\n- Use the page's **Reset** action before independent scenarios.\n- No server, credentials, network, or production data are required.\n- Browser automation may use an available browser tool or Playwright installation.\n  Do not add a dependency merely to mirror an implementation detail.\n- Record hashes of both HTML files, `assets/factory-floor.js`, `assets/factory-floor.css`, and this guide with the verification attempt.\n\n## Browser flows\n\n### FLOW-001 \u2014 service selection and isolation\n\n1. Open the page. Assert Factory shows AppliedIn, Service Line, and Website floors.\n   Open Services and assert the same three services appear in the directory.\n2. Open AppliedIn. Assert the factory has Intake, Plan, Approval, Implement, Verify,\n   and Ready stages, with work items in their current stages.\n3. Open a work item and change its executor before approval.\n4. Switch to Service Line using the top selector. Assert its work items, defaults,\n   sessions, guide, and repository differ from AppliedIn's.\n5. Switch back. Assert the previous AppliedIn selection and executor change remain.\n6. Search services and global work items. Open a result and verify its service context.\n\n### FLOW-002 \u2014 approval, failure, repair, and evidence\n\n1. Reset. Open AppliedIn, then review WI-042's plan.\n2. Assert **Next sample step** is unavailable before approval.\n3. Select **Failed check \u2192 repair** and approve the plan.\n4. Advance. Assert the targeted retry check and full suite both fail. Inspect the\n   illustrative command output and revision; the result cannot be ready.\n5. Pause. Assert advancement is unavailable. Resume.\n6. Return to Factory line and advance through repair. Assert the item moves back\n   to Implement and previous evidence is retained as history, not current evidence.\n7. Advance through fresh checks and review. Assert Ready is reached only after all\n   required results match the new revision and approved plan.\n8. Inspect the candidate lesson. Review or disable it without altering the run's gate.\n\n### FLOW-003 \u2014 missing evidence and human acceptance\n\n1. Reset. Choose **Missing evidence**, approve WI-042, and advance.\n2. Assert the result is inconclusive and advancement stops. No pass is shown.\n3. Resolve the sample blocker using **Retry checks in preview**. Advance through\n   new checks and review; inspect the new attempt's evidence.\n4. Reset. Request a plan change, then preview the revision. Assert the plan version\n   increases and the new criterion requires human acceptance.\n5. Select **All checks pass**, approve, and advance. Assert the human criterion is\n   still unresolved and the next-step control cannot approve it.\n6. Explicitly confirm acceptance, then finish the separate review. Assert Ready.\n\n### FLOW-004 \u2014 new services and work items\n\n1. Open New service. Enter an AppliedIn example repository path and select **Read\n   repository with Claude**. Assert the preview disclosure is visible and the bundled\n   description and test command appear. Edit both before creating the service.\n   Try an unknown repository and assert no command is invented. Enter its fields\n   manually. The preview must not claim Claude ran or read arbitrary local folders.\n2. Assert it opens with an empty factory line and its own verification guide.\n3. Create a work item. Assert it inherits this service's executor default.\n4. Preview its plan. Inspect criteria and required checks before approval.\n5. Switch services. Assert neither the work item nor its lessons appear elsewhere.\n6. Reset. Assert the newly created example service disappears. No filesystem folder\n   or command execution should have occurred.\n\n### FLOW-005 \u2014 navigation and presentation\n\n- Open a session from Sessions and verify the matching work item and context.\n- Inspect the verification guide from the line and the work item's Checks view.\n- Toggle dark/light themes. Keep controls and evidence readable in both.\n- Exercise keyboard navigation, tab selection, modal dismissal, and visible focus.\n- Inspect widths 1440, 1280, 768, 390, and 360 pixels. No document-level horizontal\n  overflow is allowed. The factory line may scroll horizontally inside its region.\n- On desktop, the work list and detail content scroll within their panes. Approval\n  controls remain accessible. On mobile, content may scroll vertically.\n- Open `service-line.html`, its verification section, and the embedded preview.\n- On the published site, open `/docs/` and every documentation page. Check the\n  navigation, mock UI links, workflow example, verification-guide links, and screenshots.\n  Check docs at desktop and mobile widths; all text and tables must remain readable.\n\n### FLOW-006 \u2014 spatial factory\n\n1. Reset. Assert Factory is the opening view and the counters match the sample\n   work: one running item, two needing attention, and one ready for review.\n2. Select AppliedIn's Implement workstation. Assert WI-041 and Claude appear in\n   the inspector. Open Session and verify the implementation context belongs to it.\n3. Return to Factory. Select Service Line, then Website. Assert each floor and its\n   inspector show only that service's work; Website shows an empty state.\n4. Switch services with the top selector while on Factory. Assert it remains the\n   spatial view. Select Line and confirm the same service and work selection.\n5. Approve WI-042 through its plan. Return to Factory and advance the sample\n   through failed checks, repair, and Ready. Assert the workstation and counters\n   reflect each transition; selecting a station never approves or advances work.\n6. Exercise stations and floor controls using the keyboard. Empty stations explain\n   that they contain no work. Multiple items at one station can be cycled.\n7. Create a service and work item, then return to Factory. Assert its floor and work\n   appear. Reset removes them. Check desktop and mobile layouts and reduced motion.\n\n## Traffic replay and observations\n\nBackend replay is **not applicable to this static prototype**. It has no backend\nor traffic fixtures. Do not describe simulated check output as replay evidence.\n\nRequired observations:\n\n- Browser actions and resulting visible state for the flows above.\n- Screenshots of Services, Factory, Factory line, work-item evidence, and mobile layout.\n- JavaScript page errors: none.\n- Network requests: no unexpected external requests or remote side effects.\n- State: verify service separation, current plan/revision gates, and retained attempt history.\n\nServer logs, database diffs, and distributed traces are not applicable here. When\nthe runtime or a backend is added, revise this contract to define real startup,\nreset, replay fixtures, browser journeys, and server/state assertions before\nclaiming end-to-end service verification. Use `templates/service-line-verification.md`.\n\n## Result\n\nReport which flows actually ran, their outcomes, evidence locations, and any\nunresolved limitation. Missing required evidence is inconclusive. A failure must\nbe fixed and rechecked before reporting the prototype verified.\n";

    function verificationView(){const s=activeService();return `<div class="page"><div class="page-breadcrumb">${esc(s.name)} / Verification</div><h1>Verification guide</h1><p class="page-intro"><code>service-line-verification.md</code> lives in the service’s product repository. The approved plan pins its version.</p><div class="callout"><strong>Guide v${s.guideVersion} · ${s.id==='serviceline'?'Local prototype contract':'Proposed instance contract'}</strong><p>Defines the environment, browser flows, traffic replay, assertions, and required evidence.</p></div><table class="contract-table"><thead><tr><th>Step</th><th>What the verifier does</th></tr></thead><tbody><tr><td>Prepare</td><td>Start the permitted test environment and reset synthetic data.</td></tr><tr><td>Exercise</td><td>Click, type, submit, and navigate through the specified browser flows.</td></tr><tr><td>Replay</td><td>Replay approved traffic fixtures against the isolated backend, or mock responses when testing the browser alone.</td></tr><tr><td>Observe</td><td>Collect browser traces, requests, responses, console errors, server logs, and relevant state changes.</td></tr><tr><td>Assert</td><td>Compare the evidence with the guide and work item’s acceptance criteria.</td></tr></tbody></table><details open><summary>service-line-verification.md</summary><pre>${esc(guideText(s))}</pre></details><p class="note">This preview shows the contract. It does not start a service, replay traffic, or execute a browser agent.</p></div>`}

    function openNewService(){dialog(`<h2 id="dialog-title">New service</h2><p>Choose a repository. Claude drafts the description and test command for your review.</p><label for="service-repo">Repository folder</label><input id="service-repo" name="repo" required placeholder="/path/to/AppliedIn"><div class="hydrate-row"><button type="button" class="btn" data-action="hydrate-service">Read repository with Claude</button><span class="hydrate-status" id="hydrate-status" role="status">Reads the README, project instructions, and test configuration.</span></div><p class="hydration-note">Preview: bundled AppliedIn example only. Claude is not connected.</p><div class="hydrate-sources" id="hydrate-sources" hidden></div><div class="pair"><div><label for="service-name">Name</label><input id="service-name" name="name" required maxlength="60" placeholder="AppliedIn"></div><div><label for="service-executor">Default executor</label><select id="service-executor" name="executor"><option>Codex</option><option>Claude</option></select></div></div><label for="service-description">Description</label><textarea id="service-description" name="description" maxlength="150" placeholder="Filled from the repository. You can edit it."></textarea><label for="service-command">Test command</label><input id="service-command" name="command" required placeholder="Filled from the repository. You can edit it."><p class="hydration-note">Reading the repository does not run its tests. The default executor handles subsequent work.</p>${dialogActions('Create service')}`,d=>{const name=d.get('name').trim(),repo=d.get('repo').trim(),command=d.get('command').trim();if(!name||!repo||!command)return;let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'service';const base=id;let n=2;while(serviceStore[id])id=base+'-'+n++;serviceStore[id]={id,name,repo,description:d.get('description').trim()||'Local service',folder:'instances/'+id+'/',defaultExecutor:d.get('executor'),profile:id+'-v1',guideVersion:1,items:[],lessons:[],definitions:{suite:{id:'suite',title:'Regression checks',kind:'command',command,method:'Configured test command',expected:'The approved checks complete without failures.'},review:structuredClone(baseDefinitions.review),human:structuredClone(baseDefinitions.human)},selected:null,tab:'plan',scenario:'pass'};$('#dialog').close();selectService(id);toast('Service created in the preview. No filesystem changes were made.')})}
    function openGlobalSearch(){dialog(`<h2 id="dialog-title">Find a service or work item</h2><input class="global-search-input" id="global-search" type="search" aria-label="Search all services and work items" placeholder="Search services and work items…"><div class="search-results" id="global-results"></div>`,()=>{});renderGlobalSearch('')}
    function renderGlobalSearch(query){const q=query.toLowerCase(),rows=[];for(const s of Object.values(serviceStore)){if(s.name.toLowerCase().includes(q))rows.push(`<button type="button" class="search-result" data-open-service="${s.id}"><strong>${esc(s.name)}</strong><span>Service</span></button>`);for(const w of s.items){if((w.title+' '+w.id+' '+s.name).toLowerCase().includes(q))rows.push(`<button type="button" class="search-result" data-open-service="${s.id}" data-work-item="${w.id}"><span><strong>${esc(w.title)}</strong><span>${esc(s.name)} / ${w.id}</span></span><span>${labels[w.status]}</span></button>`)}}$('#global-results').innerHTML=rows.slice(0,12).join('')||'<p class="empty">No matching services or work items.</p>'}

    function reset(){definitions=structuredClone(baseDefinitions);items=structuredClone(seed);lessons=structuredClone(lessonSeed);selected='WI-042';page='factory';tab='plan';filter='all';query='';selectedCheck='retry';session='planning';defaultExecutor='Codex';scenario='repair';$('#search').value='';$('#scenario').value=scenario;clearTimeout(toastTimer);$('#toast').hidden=true;if($('#dialog').open)$('#dialog').close();const ready=items.find(w=>w.status==='ready');for(const id of ready.checkIds)ready.results[id]=result(ready,id,'passed');initializeServices();render()}
    function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4000)}
    function render(){saveService();renderShell();const w=current();$('#work-page').hidden=page!=='work';$('#secondary').hidden=page==='work';$('#advance').disabled=!['work','line','factory'].includes(page)||!w||w.status!=='running'||w.phase==='human';$('#scenario').disabled=!!w&&w.attempt>0&&w.status==='running';if(page==='work'){renderList();renderDetail()}else renderPage()}
    function renderList(){document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));const visible=items.filter(w=>(w.title+' '+w.id).toLowerCase().includes(query.toLowerCase())&&(filter==='all'||filter==='active'&&['running','paused'].includes(w.status)||filter==='attention'&&['waiting','changes','ready','blocked'].includes(w.status)));const groups=[['attention','Needs attention',['waiting','changes','blocked']],['active','In progress',['running','paused']],['queued','Intake',['queued']],['ready','Ready for review',['ready']],['cancelled','Cancelled',['cancelled']]];$('#work-list').innerHTML=groups.map(([key,title,states])=>{const rows=visible.filter(w=>states.includes(w.status));if(!rows.length)return '';const closed=!!collapsedGroups[serviceId+key];return `<div class="work-group"><button class="group-label" data-group="${key}" aria-expanded="${!closed}">${uiIcon('chevron')}${title}<span class="group-count">${rows.length}</span></button><div class="group-rows" ${closed?'hidden':''}>${rows.map(w=>`<button class="work-row" data-item="${w.id}" aria-current="${selected===w.id}"><span class="row-id"><span>${w.id}</span>${status(w.status)}</span><span class="row-title">${esc(w.title)}</span><span class="row-meta">${esc(w.type)} · ${w.executor}</span></button>`).join('')}</div></div>`}).join('')||'<p class="empty">No matching work items.</p>'}
    function renderDetail(){const w=current();if(!w){$('#detail').innerHTML=`<div class="blank-work">${uiIcon('work')}<h2>No work items yet</h2><p>Create a work item for ${esc(activeService().name)}. Its plan, sessions, and checks will stay with this service.</p><button class="btn primary" data-action="new-work">New work item</button></div>`;return}const locked=!!w.approved||w.status==='cancelled';if(!w.checkIds.includes(selectedCheck))selectedCheck=w.checkIds[0];$('#detail').innerHTML=`<div class="item-header"><div class="item-topline"><span>${esc(activeService().name)} / ${w.id}</span><button class="back-line" data-page="line">← Factory line</button>${status(w.status)}</div><h2>${esc(w.title)}</h2><p class="item-description">${esc(w.description)}</p><div class="item-meta"><label class="executor">Executor<select id="executor" aria-label="Work item executor" ${locked?'disabled':''}><option ${w.executor==='Codex'?'selected':''}>Codex</option><option ${w.executor==='Claude'?'selected':''}>Claude</option></select></label><span>${esc(w.type)}</span><span>software-change v1</span>${w.approved?`<span>Plan v${w.approved} approved</span>`:''}</div></div><div class="tabs" role="tablist" aria-label="Work item details">${[['plan','Plan'],['checks','Checks'],['changes','Changes'],['context','Context'],['activity','Activity']].map(([id,label])=>`<button role="tab" id="tab-${id}" aria-controls="tab-panel" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}" data-tab="${id}">${label}</button>`).join('')}</div><div class="content" id="tab-panel" role="tabpanel" tabindex="0" aria-labelledby="tab-${tab}">${tab==='plan'?planView(w):tab==='checks'?checksView(w):tab==='changes'?changesView(w):tab==='context'?contextView(w):activityView(w)}</div>${footer(w)}`}
    function criteriaTable(w){return `<table class="contract-table"><thead><tr><th scope="col">Acceptance criterion</th><th scope="col">How it is checked</th></tr></thead><tbody>${w.criteria.map(c=>`<tr><td><span class="criterion-id">${c.id}</span>${esc(c.text)}</td><td class="method">${esc(definitions[c.check].title)}</td></tr>`).join('')}</tbody></table>`}
    function planView(w){if(w.status==='queued')return `<div class="section-top"><h3>Request</h3><span class="muted">Planning has not started</span></div><p class="body-copy">The planning session will define the implementation steps and the evidence required for acceptance.</p>${criteriaTable(w)}<p class="note">“Preview plan” creates an example plan with the instance’s regression checks and a human acceptance review.</p>`;return `<div class="section-top"><h3>${w.approved?'Approved plan':'Proposed plan'}</h3><span class="muted">Version ${w.version}</span></div>${w.status==='changes'?`<div class="callout warning"><strong>Changes requested</strong><p>${esc(w.feedback)}</p></div>`:''}<ol class="plan-steps">${w.steps.map(([title,body])=>`<li><strong>${esc(title)}</strong><p>${esc(body)}</p></li>`).join('')}</ol><div class="section-label">Acceptance criteria &amp; verification</div>${criteriaTable(w)}<p class="note">Also required: ${w.checkIds.filter(id=>!w.criteria.some(c=>c.check===id)).map(id=>esc(definitions[id].title)).join(', ')}. Approving this plan also approves these checks.</p>${w.revisionNote?`<div class="callout"><strong>Revision note</strong><p>${esc(w.revisionNote)}</p></div>`:''}${w.lesson?'<p class="note">Relevant lesson: uncertain submissions require a resolved outcome. <button class="link" data-page="lessons">View source</button></p>':''}`}
    function gate(w){if(!w.approved)return {title:'Waiting for plan approval',body:'No checks have run. The plan and required checks must be approved before implementation.',status:'not_run'};const r=w.checkIds.map(id=>w.results[id]);if(r.some(x=>x?.status==='failed'))return {title:'Verification failed',body:'Repair within the approved scope, then run the checks again on the new revision.',status:'failed'};if(r.some(x=>x?.status==='inconclusive'))return {title:'Evidence is incomplete',body:'The work cannot pass. Resolve the missing evidence or request human review.',status:'inconclusive'};if(r.some(x=>!x||x.status!=='passed'||x.revision!==w.revision||x.planVersion!==w.version||x.guideVersion!==(w.approvedGuideVersion||1)))return {title:'Verification is incomplete',body:'Every required check and review must pass on this revision and plan version.',status:'not_run'};return {title:'Verification passed',body:'All required checks and reviews passed for this example revision. The result is ready for review.',status:'passed'}}
    function checksView(w){const g=gate(w);return `<div class="section-top"><h3>Required checks</h3><span class="muted">Plan v${w.version}${w.approved?` · ${w.revision}`:''}</span></div><p class="body-copy">Commands and browser flows produce recorded results. A separate ${w.executor} session reviews the change using the <code>verify</code> skill. The workflow requires both. <button class="link" data-page="verification">View service-line-verification.md</button></p><div class="check-list">${w.checkIds.map(id=>{const d=definitions[id],r=w.results[id];return `<button class="check-row" data-check="${id}" aria-expanded="${selectedCheck===id}" aria-controls="check-evidence"><span><span class="check-name">${esc(d.title)}</span><span class="check-sub">${esc(d.method)}${id==='review'?` · ${w.executor}`:''}</span></span>${status(r?.status||'not_run')}<span class="check-arrow">${selectedCheck===id?'−':'+'}</span></button>`}).join('')}</div>${evidenceView(w,selectedCheck)}<div class="gate"><div><strong>${g.title}</strong><p>${g.body}</p></div>${status(g.status)}</div>${w.history?.length?`<details><summary>Previous attempt · ${w.history[0].revision}</summary><p class="note">${Object.values(w.history[0].results).filter(r=>r.status==='failed').length} failed check. Evidence from an earlier revision cannot pass the current gate.</p><pre>${esc(JSON.stringify(w.history,null,2))}</pre></details>`:''}`}
    function evidenceView(w,id){const d=definitions[id],r=w.results[id],criteria=w.criteria.filter(c=>c.check===id).map(c=>c.id).join(', ')||(id==='review'?'All criteria':'Regression coverage');return `<section class="evidence" id="check-evidence" aria-label="Selected check evidence"><div class="evidence-head"><h3>${esc(d.title)}</h3><span class="muted">${r?'Illustrative evidence · not executed':'Check definition'}</span></div><div class="evidence-body"><dl class="metadata"><dt>Requirement</dt><dd>${esc(criteria)}</dd><dt>Expected</dt><dd>${esc(d.expected)}</dd>${d.command?`<dt>${d.kind==='browser'?'Browser action':'Command'}</dt><dd><code>${esc(d.command)}</code></dd>`:`<dt>Reviewer</dt><dd>${id==='human'?'Human':`${w.executor} · separate verification session · verify skill`}</dd>`}<dt>Environment</dt><dd>${d.kind==='command'?'Isolated checkout · permitted test environment':d.kind==='browser'?'Local browser · fixture state from the verification guide':'Approved plan, diff, repository instructions, check artifacts'}</dd>${r?`<dt>Revision</dt><dd><code>${r.revision}</code> · Plan v${r.planVersion} · Guide v${r.guideVersion} · Check profile v1</dd><dt>Artifact</dt><dd><code>runs/run-001/verification/attempt-${r.attempt}/${id}.json</code></dd><dt>${d.kind==='command'?'Exit code':'Verdict'}</dt><dd>${d.kind==='command'?r.exitCode:r.status}</dd>`:''}</dl>${r?`<pre>${esc(r.output)}</pre>${r.finding?`<p class="finding">${esc(r.finding)}</p>`:''}`:'<p class="note">No evidence yet. A passing result will include the command or review, its output, and the revision it checked.</p>'}${id==='review'?'<p class="note">The reviewer checks the actual diff and evidence, including test quality and missing cases. It cannot approve its own changes or overrule a failed command.</p>':''}${id==='human'&&w.phase==='human'?'<div class="actions" style="margin-top:15px"><button class="btn" data-action="human-fail">Request changes</button><button class="btn primary" data-action="human-pass">Confirm acceptance</button></div>':''}</div></section>`}
    function result(w,id,verdict){const d=definitions[id],r={check:id,status:verdict,planVersion:w.version,revision:w.revision,profileVersion:1,guideVersion:w.approvedGuideVersion||w.guideVersion||1,attempt:w.attempt||1,exitCode:d.kind==='command'?(verdict==='passed'?0:verdict==='failed'?1:2):null,output:''};if(d.kind==='command'){r.output=verdict==='passed'?`$ ${d.command}\n\nSample output: selected tests passed.\nExit code: 0` :verdict==='failed'?`$ ${d.command}\n\nFAILED: unconfirmed submission must not be retried\nExpected is_retryable(...) to return false.\nObserved: true\nExit code: 1`:`$ ${d.command}\n\nERROR: test environment could not load a required dependency.\nNo acceptance assertions completed.\nExit code: 2`;if(verdict==='failed')r.finding='The observed behavior violates the approved criterion.'}else if(d.kind==='browser') r.output=JSON.stringify({simulated:true,verdict,planVersion:w.version,revision:w.revision,guide:'service-line-verification.md',flows:['Service selection and isolation','Plan approval and evidence gates','Browser navigation'],artifacts:['browser-actions.json','browser-trace.zip','screenshots/'],notes:'Illustrative evidence only. No browser verification was executed by this preview.'},null,2);else r.output=JSON.stringify({verdict,planVersion:w.version,revision:w.revision,criteria:w.criteria.map(c=>({id:c.id,status:verdict,evidence:c.check===id?'Human observation recorded in this example':`attempt-${w.attempt||1}/${c.check}.json`})),blockingFindings:[],notes:verdict==='inconclusive'?'Human observation is still required.':'Sample review; no executor was invoked.'},null,2);return r}
    function changesView(w){if(!w.approved||w.phase==='implement')return '<div class="section-top"><h3>No changes recorded</h3></div><p class="body-copy">The run will attach a diff after implementation. Check results will refer to that revision.</p>';return `<div class="section-top"><h3>Change summary</h3><span class="muted">${w.revision} · Illustrative diff</span></div><p class="body-copy">${w.id==='WI-042'?'Preserve uncertain submission outcomes so they cannot enter the retry queue.':'The example implementation follows the approved plan.'}</p><p class="file-title">${w.id==='WI-042'?'src/tools/claude_chrome.py':'example-change.diff'}</p><pre class="diff">${w.id==='WI-042'?'<span class="removed">- status = "unknown"</span>\n<span class="added">+ status = "uncertain"</span>':'Example diff placeholder. No repository files were changed.'}</pre><p class="note">This preview has not modified AppliedIn. Verification evidence is invalidated whenever the implementation revision changes.</p>`}
    function sessionText(w,name){return `# ${name} session\n\nExecutor: ${w.executor}\nWork item: ${w.id}\nPlan: v${w.version}\nRevision: ${w.revision}\n\n## Goal\n${w.description}\n\n## State\n${labels[w.status]} / ${w.phase}\n\n## Next step\n${!w.approved?'Wait for approval of the plan and checks.':w.status==='ready'?'Present the result and evidence for review.':w.phase==='failed'?'Repair the failed check within the approved scope.':w.status==='blocked'?'Resolve missing evidence. Do not report a pass.':'Continue from the last checkpoint.'}\n\n## Evidence\n${w.attempt?`runs/run-001/verification/attempt-${w.attempt}/`:'No verification evidence recorded.'}`}
    function contextView(w){const available=session==='planning'||session==='implementation'&&!!w.approved||session==='verification'&&!!w.results.review;return `<div class="section-top"><h3>Session context</h3><span class="muted">${w.executor}</span></div><p class="body-copy">Each session keeps its own context and executor reference. Implementation and verification use separate sessions.</p><div class="session-tabs">${['planning','implementation','verification'].map(s=>`<button data-session="${s}" aria-pressed="${session===s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>${available?`<p class="file-title">${w.id}/sessions/${session}${session==='planning'?'-'+(w.planningSequence||1):''}/context.md</p><pre>${esc(sessionText(w,session))}</pre>`:'<p class="note">This session has not started.</p>'}${(w.archives||[]).map(a=>`<details><summary>Earlier planning session · ${a.executor}</summary><pre>${esc(a.context)}</pre></details>`).join('')}<p class="note">The engine records workflow state and evidence separately from these Markdown notes.</p>`}
    function activityView(w){return `<div class="section-top"><h3>Activity</h3><span class="muted">${w.approved?'Run 001':'Planning'}</span></div><div class="run-meta"><span>Executor: ${w.executor}</span><span>Plan: v${w.version}</span><span>Repairs: ${w.repairs} / 2</span>${w.attempt?`<span>Verification attempt: ${w.attempt}</span>`:''}</div><ol class="events">${w.events.map(([title,body],i)=>`<li><span class="event-index">${String(i+1).padStart(2,'0')}</span><strong>${esc(title)}</strong><p>${esc(body)}</p></li>`).join('')||'<li class="muted">No activity yet.</li>'}</ol>`}
    function footer(w){let title,body,buttons='';if(w.status==='waiting'){title=`Plan v${w.version} needs approval`;body='Review the scope, acceptance criteria, and required checks.';buttons='<button class="btn" data-action="request-changes">Request changes</button><button class="btn primary" data-action="approve">Approve plan</button>'}else if(w.status==='queued'){title='Request recorded';body='Planning must define the acceptance criteria and required checks.';buttons='<button class="btn primary" data-action="propose">Preview plan</button>'}else if(w.status==='changes'){title='Plan changes requested';body='A revised plan will need approval.';buttons='<button class="btn primary" data-action="revise">Preview revised plan</button>'}else if(w.status==='running'){title={implement:'Implementation in progress',failed:'Check failed · repair queued',repair:'Repair complete · checks need to run again',review:'Automated checks passed · review pending',human:'Human acceptance is required'}[w.phase]||'Verification in progress';body=`${w.executor} · Approved plan v${w.approved}. Use “Next sample step” to continue the example.`;buttons='<button class="btn danger" data-action="cancel">Cancel run</button><button class="btn" data-action="pause">Pause</button>'}else if(w.status==='paused'){title='Run paused';body='The recorded context and progress are retained.';buttons='<button class="btn danger" data-action="cancel">Cancel run</button><button class="btn primary" data-action="resume">Resume</button>'}else if(w.status==='ready'){title='Ready for review';body='Required checks passed on the current revision. No merge or publication has occurred.';buttons='<button class="btn" data-tab="checks">Inspect evidence</button><button class="btn primary" data-tab="changes">View changes</button>'}else if(w.status==='blocked'){title='Verification needs attention';body='Missing evidence or a rejected result cannot count as a pass.';buttons=w.results.human?.status==='failed'||w.phase==='limit'?'<button class="btn" data-action="replan">Request a revised plan</button>':'<button class="btn" data-action="retry">Retry checks in preview</button>'}else{title='Run cancelled';body='Recorded progress and session context are retained.';buttons='<button class="btn" data-tab="context">View context</button>'}return `<footer class="item-footer"><div><strong>${title}</strong><p>${body}</p></div><div class="actions">${buttons}</div></footer>`}
    function finish(w){if(gate(w).status!=='passed')return;w.status='ready';w.phase='done';w.events.push(['Verification passed',`All required evidence matches ${w.revision} and plan v${w.version}.`]);if(w.repairs&&!lessons.some(l=>l.id==='L-005'))lessons.push({id:'L-005',title:'Exercise the uncertain outcome path',body:'Include a regression where submission may have succeeded but confirmation was not captured. A normal failure does not exercise the duplicate risk.',source:w.id+' · Verification failure and repair',evidence:'Candidate; supported by the example check, needs review',candidate:true,enabled:false})}
    function runCommands(w,verdict){w.attempt++;for(const id of w.checkIds){if(['command','browser'].includes(definitions[id].kind)){const affected=id===w.checkIds[0]||id==='suite'&&definitions[w.checkIds[0]].method==='Offline pytest';w.results[id]=result(w,id,affected?verdict:'passed')}}w.events.push(['Checks recorded',`Attempt ${w.attempt} · ${w.revision} · ${verdict==='passed'?'checks passed':verdict==='failed'?'required checks failed':'evidence incomplete'}.`]);selectedCheck=w.checkIds[0]}
    function advance(){const w=current();if(w.status!=='running')return;if(w.phase==='implement'||w.phase==='repair'){const verdict=w.phase==='repair'?'passed':scenario==='blocked'?'inconclusive':scenario==='repair'&&w.id==='WI-042'?'failed':'passed';runCommands(w,verdict);if(verdict==='failed')w.phase='failed';else if(verdict==='inconclusive'){w.phase='blocked';w.status='blocked'}else w.phase='review';tab='checks'}else if(w.phase==='failed'){if(w.repairs>=2){w.status='blocked';w.phase='limit'}else{(w.history??=[]).push({revision:w.revision,planVersion:w.version,results:structuredClone(w.results)});w.repairs++;w.revision='sample-r'+(w.repairs+1);w.results={};w.phase='repair';w.events.push(['Repair checkpoint saved',`Same implementation session · ${w.revision}. Previous evidence is stale; required checks will run again.`]);tab='checks'}}else if(w.phase==='review'){if(w.checkIds.includes('human')&&w.results.human?.status!=='passed'){w.phase='human';w.results.human=result(w,'human','inconclusive');selectedCheck='human';w.events.push(['Human acceptance requested','The verification session needs the assigned human observations.'])}else{w.results.review=result(w,'review','passed');w.events.push(['Independent review completed',`${w.executor} verification session · verify skill · ${w.revision}.`]);finish(w);selectedCheck='review'}tab='checks'}else if(w.phase==='human'){selectedCheck='human';tab='checks';toast('A human must confirm acceptance. The next-step control cannot approve it.')}render()}
    function renderPage(){if(page==='factory'){$('#secondary').innerHTML=factoryView();return}if(page==='services'){$('#secondary').innerHTML=servicesView();return}if(page==='line'){$('#secondary').innerHTML=lineView();return}if(page==='sessions'){$('#secondary').innerHTML=sessionsView();return}if(page==='verification'){$('#secondary').innerHTML=verificationView();return}let html='';if(page==='workflow')html=`<h1>Workflow</h1><p class="page-intro">software-change v1 · One workflow for bugs, features, refactors, and maintenance.</p><ol class="workflow-steps"><li><strong>Plan</strong><span>Scope and checks</span></li><li><strong>Approve</strong><span>Human decision</span></li><li><strong>Implement</strong><span>Selected executor</span></li><li><strong>Check</strong><span>Recorded commands</span></li><li><strong>Review</strong><span>verify skill</span></li><li><strong>Result</strong><span>Diff and evidence</span></li></ol><h2>What decides the next step</h2><table class="contract-table"><thead><tr><th>Outcome</th><th>Workflow action</th></tr></thead><tbody><tr><td>Every required check and review passes</td><td>Mark the result ready for review. Evidence must match the current revision and approved plan.</td></tr><tr><td>A check fails</td><td>Repair within the approved scope, in the same implementation session. Run the required checks again. Maximum 2 repairs.</td></tr><tr><td>Evidence is missing or inconclusive</td><td>Stop for investigation or human review. No pass is recorded.</td></tr><tr><td>Scope or acceptance requirements change</td><td>Revise the plan and obtain approval again.</td></tr></tbody></table><h2>Where the rules live</h2><ul class="rule-list"><li><strong>Instance configuration:</strong> repository commands, required suites, and permitted environments.</li><li><strong>Approved plan:</strong> acceptance criteria and the checks needed for this work item.</li><li><strong>verify skill:</strong> instructions for reviewing the diff, test quality, and evidence in a separate session.</li><li><strong>Engine:</strong> runs checks, records artifacts, validates results, and chooses the next state.</li></ul><p class="note">Skills are instructions used by executor tasks within a workflow. They do not add another top-level primitive.</p><details><summary>Proposed ASL-style verification branch</summary><pre>${esc(JSON.stringify({StartAt:'RunChecks',States:{RunChecks:{Type:'Task',Resource:'service-line:checks.run',Next:'Review'},Review:{Type:'Task',Resource:'service-line:agent.verify',Next:'Evaluate'},Evaluate:{Type:'Task',Resource:'service-line:verification.evaluate',Next:'Route'},Route:{Type:'Choice',Choices:[{Variable:'$.verification.verdict',StringEquals:'passed',Next:'Result'},{And:[{Variable:'$.verification.verdict',StringEquals:'failed'},{Variable:'$.repairs',NumericLessThan:2}],Next:'Repair'}],Default:'NeedsAttention'},Repair:{Type:'Task',Resource:'service-line:agent.repair',Next:'RunChecks'},Result:{Type:'Succeed'},NeedsAttention:{Type:'Fail',Cause:'Verification requires a human decision'}}},null,2))}</pre><p class="note">Proposal only. Custom actions enforce the plan, current revision, evidence requirements, and repair count. This HTML does not implement the engine.</p></details>`;
      if(page==='lessons')html=`<h1>Lessons</h1><p class="page-intro">Local notes with evidence and a source. Reviewed lessons can inform future plans.</p>${lessons.map(l=>`<article class="lesson"><div class="lesson-top"><h2>${esc(l.title)}</h2><span class="muted small">${l.candidate?'Needs review':l.enabled?'In use':'Disabled'}</span></div><p>${esc(l.body)}</p><div class="lesson-meta"><span>${esc(l.source)}</span><span>${esc(l.evidence)}</span></div><div class="lesson-actions">${l.candidate?`<button class="btn" data-action="dismiss-lesson" data-lesson="${l.id}">Dismiss</button><button class="btn" data-action="review-lesson" data-lesson="${l.id}">Review lesson</button>`:`<button class="link" data-action="edit-lesson" data-lesson="${l.id}">Edit</button><button class="link" data-action="toggle-lesson" data-lesson="${l.id}">${l.enabled?'Disable':'Enable'}</button>`}</div></article>`).join('')}<p class="note">A failed check can suggest a lesson. It is retained for reuse only after validation or human review. Lessons cannot weaken a required check or bypass approval.</p>`;
      if(page==='settings')html=`<h1>Instance settings</h1><p class="page-intro">${esc(activeService().name)} · Defaults and verification rules for this instance.</p><div class="settings-row"><div><strong>Default executor</strong><p>Used by new work items. Each work item can override it before approval.</p></div><select id="default-executor" aria-label="Default executor"><option ${defaultExecutor==='Codex'?'selected':''}>Codex</option><option ${defaultExecutor==='Claude'?'selected':''}>Claude</option></select></div><div class="settings-row"><div><strong>Repository</strong><div class="path">${esc(activeService().repo)}</div></div></div><div class="settings-row"><div><strong>Verification profile</strong><p>Required regression suite; targeted checks are selected during planning.</p><div class="path">${esc(definitions.suite.command)}</div></div><span class="small muted">Proposed v1</span></div><div class="settings-row"><div><strong>Verification guide</strong><p>The approved plan pins this file’s version.</p><div class="path">${esc(activeService().repo)}/service-line-verification.md</div></div><button class="link" data-page="verification">Open guide</button></div><div class="settings-row"><div><strong>Test environment</strong><p>${activeService().id==='appliedin'?'Offline checks under the current repository policy. Use fixtures and fake subprocesses.':'Use the isolated environment, browser flows, and traffic fixtures specified in the verification guide.'}</p></div></div><div class="settings-row"><div><strong>Human approval</strong><p>Required for a plan and its checks. Scope or acceptance changes require another approval.</p></div></div><p class="note">Configuration and actions in this preview only affect the page. Reload or reset to restore the examples.</p>`;$('#secondary').innerHTML=`<div class="page">${html}</div>`}
    function dialog(html,onSubmit){$('#dialog-form').innerHTML=html;$('#dialog').setAttribute('aria-labelledby','dialog-title');$('#dialog-form').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget))};$('#dialog').showModal()}
    function dialogActions(label){return `<div class="actions"><button class="btn" type="button" data-action="close-dialog">Cancel</button><button class="btn primary" type="submit">${label}</button></div>`}
    function action(name,el){if(name==='hydrate-service'){hydrateService();return}if(name==='new-work'){$('#new-item').click();return}if(name==='new-service'){openNewService();return}if(name==='global-search'){openGlobalSearch();return}if(name==='theme'){theme=theme==='dark'?'light':'dark';renderShell();return}const w=current();if(name==='close-dialog'){$('#dialog').close();return}if(name==='approve'&&w.status==='waiting'){w.approvedGuideVersion=activeService().guideVersion;w.guideVersion=activeService().guideVersion;w.approved=w.version;w.phase='implement';w.status='running';w.events.push([`Plan v${w.version} approved`,'Scope, criteria, and required checks are locked for this run.'],['Implementation started',`${w.executor} · implementation session.`]);tab='checks';toast('Example plan approved. Use “Next sample step” to inspect verification.')}if(name==='pause'&&w.status==='running'){w.status='paused';w.events.push(['Run paused','Progress and context retained.'])}if(name==='resume'&&w.status==='paused'){w.status='running';w.events.push(['Run resumed','Continuing from the recorded checkpoint.'])}if(name==='cancel'&&['running','paused'].includes(w.status)){w.status='cancelled';w.events.push(['Run cancelled','Progress, context, and evidence retained.'])}if(name==='propose'&&w.status==='queued'){w.status='waiting';w.phase='approval';w.events.push(['Example plan prepared','Verification includes a human acceptance review.']);tab='plan'}if(name==='revise'&&w.status==='changes'){w.version++;w.revisionNote=w.feedback;w.criteria.push({id:'AC'+(w.criteria.length+1),text:w.feedback,check:'human'});if(!w.checkIds.includes('human'))w.checkIds.push('human');w.status='waiting';w.events.push([`Plan v${w.version} prepared`,'Feedback added as a criterion requiring human acceptance.']);tab='plan'}if(name==='request-changes'&&w.status==='waiting'){dialog(`<h2 id="dialog-title">Request plan changes</h2><p>${w.id} · Plan v${w.version}</p><label for="feedback">What should change?</label><textarea id="feedback" name="feedback" required></textarea>${dialogActions('Save request')}`,d=>{const value=d.get('feedback').trim();if(!value)return;w.feedback=value;w.status='changes';w.events.push(['Changes requested',value]);$('#dialog').close();render()});return}if(name==='retry'&&w.status==='blocked'){scenario='pass';$('#scenario').value=scenario;w.status='running';w.phase='repair';w.events.push(['Example environment restored','Retry the required checks on the same revision.']);toast('Example blocker resolved. Use “Next sample step” to rerun checks.')}if(name==='replan'&&w.status==='blocked'){(w.history??=[]).push({revision:w.revision,planVersion:w.version,results:structuredClone(w.results)});w.approved=null;w.results={};w.feedback='Resolve the blocking review finding and provide evidence for acceptance.';w.status='changes';w.phase='approval';tab='plan'}if(name==='human-pass'&&w.phase==='human'){w.results.human=result(w,'human','passed');w.events.push(['Human acceptance recorded',`Criteria confirmed for ${w.revision} and plan v${w.version}.`]);w.phase='review';toast('Human acceptance recorded. The verification review can now finish.')}if(name==='human-fail'&&w.phase==='human'){w.results.human=result(w,'human','failed');w.status='blocked';w.events.push(['Human acceptance rejected','The result needs investigation and a reviewed repair plan.'])}if(['toggle-lesson','dismiss-lesson','review-lesson','edit-lesson'].includes(name)){const l=lessons.find(l=>l.id===el.dataset.lesson);if(name==='toggle-lesson')l.enabled=!l.enabled;else if(name==='dismiss-lesson')lessons=lessons.filter(x=>x.id!==l.id);else{dialog(`<h2 id="dialog-title">${l.candidate?'Review':'Edit'} lesson</h2><p>${esc(l.source)} · Changes apply to future plans.</p><label for="lesson-body">Lesson</label><textarea id="lesson-body" name="body" required>${esc(l.body)}</textarea>${dialogActions(l.candidate?'Confirm and enable':'Save lesson')}`,d=>{const body=d.get('body').trim();if(!body)return;l.body=body;l.candidate=false;l.enabled=true;l.evidence='Human reviewed';$('#dialog').close();render()});return}}render()}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.openService){if($('#dialog').open)$('#dialog').close();selectService(b.dataset.openService,b.dataset.workItem)}else if(b.dataset.followRun){selected=b.dataset.followRun;render()}else if(b.dataset.group){const key=serviceId+b.dataset.group;collapsedGroups[key]=!collapsedGroups[key];renderList()}else if(b.dataset.page){page=b.dataset.page;render()}else if(b.dataset.item){selected=b.dataset.item;tab=b.dataset.openSession?'context':'plan';session=b.dataset.openSession||'planning';page='work';render()}else if(b.dataset.tab){tab=b.dataset.tab;renderDetail();$('#tab-'+tab).focus()}else if(b.dataset.check){selectedCheck=b.dataset.check;renderDetail();document.querySelector(`[data-check="${selectedCheck}"]`).focus()}else if(b.dataset.filter){filter=b.dataset.filter;renderList()}else if(b.dataset.session){session=b.dataset.session;renderDetail();document.querySelector(`[data-session="${session}"]`).focus()}else if(b.dataset.action)action(b.dataset.action,b)});
    document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const ids=['plan','checks','changes','context','activity'];let i=ids.indexOf(tab);i=e.key==='Home'?0:e.key==='End'?ids.length-1:(i+(e.key==='ArrowRight'?1:ids.length-1))%ids.length;tab=ids[i];renderDetail();$('#tab-'+tab).focus()}});
    document.addEventListener('input',e=>{if(e.target.id==='service-repo'&&$('#hydrate-status')){for(const id of ['service-name','service-description','service-command']){const field=$('#'+id);if(field.dataset.hydratedValue===field.value)field.value='';delete field.dataset.hydratedValue}$('#hydrate-status').textContent='Reads the README, project instructions, and test configuration.';$('#hydrate-status').dataset.state='';$('#hydrate-sources').hidden=true}});
    document.addEventListener('change',e=>{if(e.target.id==='service-select'){if(e.target.value==='all'){page='services';render()}else selectService(e.target.value,undefined,page==='factory'?'factory':undefined);return}if(e.target.id==='executor'){const w=current();(w.archives??=[]).push({executor:w.executor,context:sessionText(w,'planning')});w.executor=e.target.value;w.planningSequence=(w.planningSequence||1)+1;w.events.push(['Executor changed',`New ${w.executor} session. Prior sessions keep their original references.`]);render()}if(e.target.id==='default-executor'){defaultExecutor=e.target.value;toast(defaultExecutor+' will be used for new work items.')}if(e.target.id==='scenario')scenario=e.target.value});
    $('#search').addEventListener('input',e=>{query=e.target.value;renderList()});$('#reset').addEventListener('click',()=>{reset();toast('Examples reset.')});$('#advance').addEventListener('click',advance);
    $('#new-item').addEventListener('click',()=>{dialog(`<h2 id="dialog-title">New work item</h2><p>Define the outcome. Planning will specify the change and how to verify it.</p><label for="title">Title</label><input id="title" name="title" maxlength="110" required><div class="pair"><div><label for="type">Type</label><select id="type" name="type"><option>Feature</option><option>Bug</option><option>Refactor</option><option>Maintenance</option></select></div><div><label for="new-executor">Executor</label><select id="new-executor" name="executor"><option ${defaultExecutor==='Codex'?'selected':''}>Codex</option><option ${defaultExecutor==='Claude'?'selected':''}>Claude</option></select></div></div><label for="goal">Goal</label><textarea id="goal" name="goal" required></textarea><label for="criteria">Acceptance criteria</label><textarea id="criteria" name="criteria" required placeholder="One criterion per line"></textarea>${dialogActions('Create work item')}`,d=>{const title=d.get('title').trim(),description=d.get('goal').trim(),criteria=d.get('criteria').split('\n').map(s=>s.trim()).filter(Boolean);if(!title||!description||!criteria.length)return;const id='WI-'+String(Math.max(0,...items.map(w=>Number(w.id.slice(3))))+1).padStart(3,'0');items.unshift({id,title,description,type:d.get('type'),executor:d.get('executor'),status:'queued',phase:'queued',version:1,revision:'sample-r1',steps:[['Read the request','Inspect the repository and relevant lessons.'],['Implement the approved plan',description],['Verify','Run the configured suite and request evidence for human acceptance.']],criteria:criteria.map((text,i)=>({id:'AC'+(i+1),text,check:'human'})),checkIds:['suite','review','human'],results:{},attempt:0,repairs:0,events:[['Request recorded','Acceptance criteria recorded for planning.']]});selected=id;page='work';tab='plan';filter='all';query='';$('#search').value='';$('#dialog').close();render()})});
    document.addEventListener('input',e=>{if(e.target.id==='service-search'){serviceQuery=e.target.value;const all=Object.values(serviceStore).filter(s=>(s.name+' '+s.repo).toLowerCase().includes(serviceQuery.toLowerCase()));$('#service-grid').innerHTML=all.map(serviceCard).join('')||'<p class="empty">No matching services.</p>';$('#service-count').textContent=all.length+' services'}if(e.target.id==='global-search')renderGlobalSearch(e.target.value)});
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch()}});
    reset();
  </script>
